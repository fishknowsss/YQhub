<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YQhub redesign wireframe</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f3ed;
        --panel: #fffdf8;
        --panel-2: #ede8dd;
        --ink: #22201c;
        --muted: #716d64;
        --line: #d9d2c5;
        --accent: #237066;
        --danger: #b24a3d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--bg);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      }

      .wireframe {
        display: grid;
        grid-template-rows: 58px 1fr;
        width: min(1440px, 100vw);
        height: 900px;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid var(--line);
        background: var(--bg);
      }

      .topbar {
        display: grid;
        grid-template-columns: 220px 1fr auto;
        align-items: center;
        gap: 18px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 253, 248, 0.92);
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-weight: 700;
      }

      .brand span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }

      .tabs {
        display: flex;
        gap: 6px;
      }

      .tabs button,
      .actions button,
      .generate {
        height: 34px;
        padding: 0 14px;
        color: var(--ink);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 10px;
        font: inherit;
      }

      .tabs .active {
        background: var(--panel-2);
        border-color: var(--line);
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .generate {
        color: white;
        background: var(--accent);
        border-color: var(--accent);
      }

      .workspace {
        display: grid;
        grid-template-columns: 330px minmax(520px, 1fr) 360px;
        min-height: 0;
      }

      .panel {
        min-height: 0;
        padding: 16px;
        overflow: hidden;
        border-right: 1px solid var(--line);
      }

      .panel:last-child {
        border-right: 0;
        border-left: 1px solid var(--line);
      }

      .scroll {
        display: grid;
        gap: 14px;
        height: 100%;
        min-height: 0;
        overflow: auto;
        padding-right: 4px;
      }

      .section {
        display: grid;
        gap: 10px;
      }

      .section h3 {
        margin: 0;
        font-size: 14px;
      }

      .field,
      .drop,
      .asset,
      .task,
      .preview,
      .empty {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
      }

      .field {
        padding: 12px;
      }

      .field label {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
      }

      .field div {
        height: 32px;
        border-radius: 8px;
        background: var(--panel-2);
      }

      .drop {
        display: grid;
        place-items: center;
        height: 164px;
        color: var(--muted);
        border-style: dashed;
      }

      .asset-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .asset {
        display: grid;
        grid-template-rows: 104px 44px;
        overflow: hidden;
      }

      .thumb {
        background:
          linear-gradient(135deg, rgba(35, 112, 102, 0.18), rgba(178, 74, 61, 0.12)),
          var(--panel-2);
      }

      .asset footer,
      .task footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .stage {
        display: grid;
        grid-template-rows: minmax(0, 1fr) 186px;
        min-height: 0;
        padding: 18px;
      }

      .preview {
        display: grid;
        place-items: center;
        min-height: 0;
        background:
          radial-gradient(circle at 18% 12%, rgba(35, 112, 102, 0.16), transparent 34%),
          linear-gradient(180deg, #fffcf6, #eee7dc);
      }

      .preview-card {
        width: min(72%, 720px);
        aspect-ratio: 16 / 9;
        border: 1px solid #cfc6b7;
        border-radius: 16px;
        background: #1f211f;
        box-shadow: 0 28px 70px rgba(64, 54, 38, 0.22);
      }

      .composer {
        display: grid;
        grid-template-columns: 1fr 210px;
        gap: 14px;
        margin-top: 14px;
        min-height: 0;
      }

      .prompt {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
      }

      .prompt .lines {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .prompt .lines span {
        height: 10px;
        border-radius: 20px;
        background: var(--panel-2);
      }

      .controls {
        display: grid;
        gap: 10px;
      }

      .queue-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .queue-head h3 {
        margin: 0;
        font-size: 15px;
      }

      .task {
        padding: 12px;
      }

      .task strong {
        display: block;
        margin-bottom: 10px;
        font-size: 13px;
      }

      .bar {
        height: 8px;
        overflow: hidden;
        border-radius: 99px;
        background: var(--panel-2);
      }

      .bar i {
        display: block;
        height: 100%;
        width: 72%;
        background: var(--accent);
      }

      .history {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .empty {
        display: grid;
        place-items: center;
        height: 88px;
        color: var(--muted);
        font-size: 13px;
      }

      .caption {
        margin: 14px auto 0;
        max-width: 980px;
        color: #615c53;
        font-size: 14px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="wireframe">
      <header class="topbar">
        <div class="brand">YQhub <span>小云雀工作台</span></div>
        <nav class="tabs" aria-label="工作区">
          <button class="active">生成</button>
          <button>历史</button>
          <button>设置</button>
        </nav>
        <div class="actions">
          <button>浅色</button>
          <button>账号</button>
          <button class="generate">生成</button>
        </div>
      </header>
      <main class="workspace">
        <aside class="panel">
          <div class="scroll">
            <section class="section">
              <h3>参考素材</h3>
              <div class="drop">拖入图片、视频或音频</div>
              <div class="asset-grid">
                <article class="asset"><div class="thumb"></div><footer><span>图一</span><span>萧衍</span></footer></article>
                <article class="asset"><div class="thumb"></div><footer><span>视频一</span><span>动作参考</span></footer></article>
                <article class="asset"><div class="thumb"></div><footer><span>音频一</span><span>旁白节奏</span></footer></article>
                <article class="asset"><div class="thumb"></div><footer><span>图二</span><span>言笑</span></footer></article>
              </div>
            </section>
            <section class="section">
              <h3>账号</h3>
              <div class="field"><label>当前 API Key</label><div></div></div>
            </section>
          </div>
        </aside>
        <section class="stage">
          <div class="preview">
            <div class="preview-card"></div>
          </div>
          <div class="composer">
            <div class="prompt">
              <strong>提示词</strong>
              <div class="lines">
                <span style="width: 88%"></span>
                <span style="width: 76%"></span>
                <span style="width: 64%"></span>
              </div>
            </div>
            <div class="controls">
              <div class="field"><label>时长</label><div></div></div>
              <div class="field"><label>分辨率</label><div></div></div>
            </div>
          </div>
        </section>
        <aside class="panel">
          <div class="queue-head">
            <h3>队列</h3>
            <span>3 个任务</span>
          </div>
          <div class="scroll">
            <article class="task">
              <strong>茶饮短片，镜头干净</strong>
              <div class="bar"><i></i></div>
              <footer><span>生成中</span><span>约 42 秒</span></footer>
            </article>
            <article class="task">
              <strong>人物关系清楚，电影感</strong>
              <div class="bar"><i style="width: 18%"></i></div>
              <footer><span>排队中</span><span>等待</span></footer>
            </article>
            <section class="section">
              <h3>本机历史</h3>
              <div class="history">
                <div class="empty">上一条成片</div>
                <div class="empty">导出记录</div>
              </div>
            </section>
          </div>
        </aside>
      </main>
    </div>
    <p class="caption">
      草图目标：去掉左上角不明图标；整窗固定为单屏工作台，只让素材栏和队列栏内部滚动；中间是预览和提示词主操作区；浅色模式按独立视觉系统设计，不再由深色主题简单反色。
    </p>
  </body>
</html>
