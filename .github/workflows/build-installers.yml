name: Build Installers

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run dist:mac && npm run release:bundle

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: YQhub-macos
          path: release/YQhub-v*/
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run dist:win && npm run release:bundle

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: YQhub-windows
          path: release/YQhub-v*/
          if-no-files-found: error
          retention-days: 3
